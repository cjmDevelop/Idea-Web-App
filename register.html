<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - Random📝Writes ‣ Random⚡️Lights</title>
  <link rel="icon" type="image/png" href="/ideaFav.png">
  <link rel="stylesheet" href="src/styles/style.css" />
  <link rel="stylesheet" href="src/styles/auth.css" />
</head>
<body>
  <main class="container">
    <div class="banner">
      <h4>Create an account to save unlimited thoughts 🧠</h4>
    </div>
    
    <form id="register-form" class="auth-form">
      <h1>Create Account</h1>
      
      <section class="idea-input">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          required
          placeholder="your@email.com"
          autocomplete="email"
        />
      </section>

      <section class="idea-input">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          required
          minlength="6"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        />
      </section>

      <section class="idea-input">
        <label for="firstName">First Name (optional)</label>
        <input 
          type="text" 
          id="firstName" 
          placeholder="John"
          autocomplete="given-name"
        />
      </section>

      <section class="idea-input">
        <label for="lastName">Last Name (optional)</label>
        <input 
          type="text" 
          id="lastName" 
          placeholder="Doe"
          autocomplete="family-name"
        />
      </section>

      <div id="error-message" class="error-message"></div>

      <section class="buttons">
        <button type="submit" class="submit-btn">Create Account</button>
      </section>

      <p class="auth-switch">
        Already have an account? 
        <a href="login.html">Login here</a>
      </p>
      
      <p class="auth-switch">
        <a href="index.html">← Back to app</a>
      </p>
    </form>
  </main>

  <script type="module">
    import { registerUser } from './src/services/api.js';

    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const firstName = document.getElementById('firstName').value.trim() || null;
      const lastName = document.getElementById('lastName').value.trim() || null;
      
      try {
        errorMsg.textContent = '';
        errorMsg.style.display = 'none';
        
        console.log('📝 Attempting registration...');
        await registerUser(email, password, firstName, lastName);
        
        console.log('✅ Registration successful! Check your email.');
        
        // Save email for verification page
        localStorage.setItem('pendingEmail', email);
        
        // Redirect to verification
        window.location.href = 'verify.html';
        
      } catch (error) {
        console.error('❌ Registration failed:', error);
        errorMsg.textContent = error.message || 'Registration failed. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
