<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Random📝Writes ‣ Random⚡️Lights</title>
  <link rel="icon" type="image/png" href="/ideaFav.png">
  <link rel="stylesheet" href="src/styles/style.css" />
  <link rel="stylesheet" href="src/styles/auth.css" />
</head>
<body>
  <main class="container">
    <div class="banner">
      <h4>Login to save your thoughts across all devices 🔐</h4>
    </div>
    
    <form id="login-form" class="auth-form">
      <h1>Login</h1>
      
      <div style="margin-bottom: 20px;">
        <label for="email" style="display: block; color: yellow; margin-bottom: 8px; font-weight: 600;">Email</label>
        <input 
          type="email" 
          id="email" 
          required
          placeholder="your@email.com"
          style="width: 100%; padding: 12px; background: #222; border: 2px solid #444; border-radius: 8px; color: white; font-size: 16px;"
        />
      </div>

      <div style="margin-bottom: 20px;">
        <label for="password" style="display: block; color: yellow; margin-bottom: 8px; font-weight: 600;">Password</label>
        <input 
          type="password" 
          id="password" 
          required
          placeholder="Enter your password"
          style="width: 100%; padding: 12px; background: #222; border: 2px solid #444; border-radius: 8px; color: white; font-size: 16px;"
        />
      </div>

      <div id="error-message" style="color: #ff5555; background: rgba(255, 85, 85, 0.1); border: 2px solid #ff5555; border-radius: 8px; padding: 12px; margin-bottom: 20px; text-align: center; display: none;"></div>

      <button type="submit" style="width: 100%; padding: 14px; background: linear-gradient(135deg, yellow 0%, #ffd700 100%); color: black; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer;">
        Login
      </button>

      <p style="text-align: center; color: #ddd; font-size: 14px; margin-top: 15px;">
        Don't have an account? 
        <a href="register.html" style="color: yellow; text-decoration: none; font-weight: 600;">Create one here</a>
      </p>
      
      <p style="text-align: center; color: #ddd; font-size: 14px; margin-top: 10px;">
        <a href="index.html" style="color: yellow; text-decoration: none; font-weight: 600;">← Back to app</a>
      </p>
    </form>
  </main>

  <script type="module">
    import { loginUser } from './src/services/api.js';

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      console.log('🔐 Attempting login with:', email);
      
      try {
        errorMsg.textContent = '';
        errorMsg.style.display = 'none';
        
        await loginUser(email, password);
        
        console.log('✅ Login successful! Redirecting...');
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('❌ Login failed:', error);
        errorMsg.textContent = error.message || 'Login failed. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
