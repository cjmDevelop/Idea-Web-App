<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Idea Counter Web App</title>
  <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>

  <div id="notification" class="notification"></div>

  <aside class="saved-ideas">
    <!-- <h2>Saved Ideas</h2>
    <p class="help-text">Click any lightbulb to restore that idea to the text box!</p> -->
    <div id="bright-ideas"></div>
  </aside>

  <main class="container">
    <h1>Idea Saver</h1>
    <p>Ideas entered: <span id="count-el">0</span></p>

    <section class="idea-input">
      <label for="idea"></label>
      <textarea id="idea" rows="6" placeholder="Be less curious about people and more curious about ideas   - Marie Curie"></textarea>
    </section>

    <section class="buttons">
      <button id="increment-btn" onclick="increment()" disabled>Save Idea</button>
      <button class="clear-btn" onclick="clearAll()">Clear All</button>
    </section>
  </main>

  <script src="src/scripts/index.js"></script>
</body>
</html>
