<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Lights</title>
  <link rel="icon" type="image/png" href="/ideaFav.png">
  <link rel="stylesheet" href="src/styles/style.css" />
</head>
<body>

      <aside class="saved-ideas">
        <div id="ideas-as-lightbulbs"></div>
      </aside>

  <main class="container">

   <form>
    <h1>Random Lights</h1>
    <p>Ideas entered: <span id="counter">0</span></p>

 
    <section class="idea-input">
      <label for="idea"></label>
      <textarea id="idea" rows="6" required 
      placeholder=
      "Be less curious about people and more curious about ideas   - Marie Curie"></textarea>
    </section>

    <section class="buttons">
      <button id="increment-btn" onclick="increment()">Enter</button>
    </section>
   </form>

  </main>
  <script src="src/scripts/index.js"></script>
</body>
</html>
